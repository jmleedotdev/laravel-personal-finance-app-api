kind: wasmer.io/App.v0
owner: jmleedotdev
name: laravel-personal-finance-app-api
package: wasmer/laravel-personal-finance-app-api
capabilities:
  database:
    engine: mysql
  cdn_cache:
    enabled: true
jobs:
  - name: migration
    trigger: post-deployment
    action:
      execute:
        command: php artisan migrate
        cli_args:
          - "--force"
  - name: seed
    trigger: post-deployment
    action:
      execute:
        command: php artisan db:seed
